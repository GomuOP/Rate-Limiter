name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [ci-debug, ci-release, tsan]
    services:
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-13 ninja-build
          echo "CC=gcc-13"  >> "$GITHUB_ENV"
          echo "CXX=g++-13"  >> "$GITHUB_ENV"
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test
        env:
          RL_REDIS_HOST: 127.0.0.1
          RL_REDIS_PORT: "6379"
        run: ctest --preset ${{ matrix.preset }}

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format-18
      - name: Check formatting
        run: |
          find src tests -name '*.cpp' -o -name '*.hpp' \
            | xargs clang-format-18 --dry-run --Werror
